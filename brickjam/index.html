<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Brick Jam</title>
  <meta name="description" content="Slide the bricks out through the gates of their own colour.">
  <meta name="theme-color" content="#f3d3cc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Brick Jam">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <!-- Home -->
    <section id="home" class="screen active">
      <div class="home-inner">
        <div class="logo" aria-hidden="true">
          <span style="--c:#f0443e;--d:#b3221f">B</span><span style="--c:#ff8f3a;--d:#cc5c14">R</span><span style="--c:#ffd23f;--d:#cf9c12">I</span><span style="--c:#6fd35a;--d:#3f9a34">C</span><span style="--c:#2f7de1;--d:#1d54a3">K</span>
          <br>
          <span style="--c:#9b5cf0;--d:#6a33b8">J</span><span style="--c:#3fc6ef;--d:#1a8fb8">A</span><span style="--c:#ff6fb5;--d:#c93a80">M</span>
        </div>
        <h1 class="sr-only">Brick Jam</h1>
        <p class="tagline">Slide every brick out through its own colour.</p>
        <button id="playBtn" class="btn big primary">Play <span id="homeLevel">Level 1</span></button>
        <div class="home-row">
          <button id="homeSound" class="btn small">Sound: on</button>
          <button id="howBtn" class="btn small">How to play</button>
        </div>
        <a class="other-game" href="../">Also try Tap Painter →</a>
      </div>
    </section>

    <!-- Game -->
    <section id="game" class="screen">
      <header class="hud">
        <button id="pauseBtn" class="round-btn" aria-label="Pause">
          <svg viewBox="0 0 24 24" width="26" height="26"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="currentColor"/></svg>
        </button>
        <div class="hud-mid">
          <div class="level-tag">
            <div class="level-badge"><small>Level</small><b id="levelNum">1</b></div>
            <div id="tier" class="tier">NORMAL</div>
          </div>
          <div id="timer" class="timer">00:00</div>
        </div>
        <button id="restartBtn" class="round-btn" aria-label="Restart level">
          <svg viewBox="0 0 24 24" width="24" height="24"><path d="M19 12a7 7 0 11-2.05-4.95" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M19.5 3.5v5h-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </header>

      <div id="stage" class="stage">
        <div id="board" class="board">
          <div id="floor" class="floor"></div>
          <div id="gates" class="gates"></div>
          <div id="pieces" class="pieces"></div>
          <div id="exitLayer" class="exit-layer"></div>
          <div id="fx" class="fx"></div>
        </div>
        <div id="banner" class="banner"></div>
      </div>

      <footer class="boosters">
        <button class="booster" data-booster="hammer" aria-label="Hammer: smash one brick">
          <span class="icon">
            <svg viewBox="0 0 48 48" width="40" height="40"><g transform="rotate(-35 24 24)"><rect x="21" y="18" width="6" height="26" rx="3" fill="#e7b04c" stroke="#a8711c" stroke-width="2"/><rect x="9" y="6" width="30" height="14" rx="4" fill="#f0e6c8" stroke="#8c7a52" stroke-width="2"/><rect x="9" y="6" width="6" height="14" rx="2" fill="#c9b98f"/><rect x="33" y="6" width="6" height="14" rx="2" fill="#c9b98f"/></g></svg>
          </span>
          <span class="count" data-count="hammer">0</span>
        </button>
        <button class="booster" data-booster="vacuum" aria-label="Vacuum: remove every brick of one colour">
          <span class="icon">
            <svg viewBox="0 0 48 48" width="40" height="40"><path d="M14 10h16l4 8v20a4 4 0 01-4 4H14a4 4 0 01-4-4V18z" fill="#3a8fd8" stroke="#1d5ea3" stroke-width="2"/><path d="M10 22h24v8H10z" fill="#ffd23f"/><path d="M34 16c6 0 8 4 8 9s-3 8-7 8" fill="none" stroke="#1d5ea3" stroke-width="3" stroke-linecap="round"/><circle cx="22" cy="14" r="2.4" fill="#fff"/></svg>
          </span>
          <span class="count" data-count="vacuum">0</span>
        </button>
      </footer>
    </section>

    <!-- Dialogs -->
    <div id="overlay" class="overlay">
      <div class="dialog" role="dialog" aria-modal="true">
        <h2 id="dlgTitle"></h2>
        <p id="dlgText"></p>
        <div id="dlgButtons" class="dlg-buttons"></div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>

  <script src="js/levels.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
